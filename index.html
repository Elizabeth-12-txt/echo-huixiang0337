<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>传讯接收器</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
:root {
  --theme-blue: #0044cc; --theme-light-blue: #3366ff; --theme-dark-blue: #0033aa;
  --gray: #c0c0c0; --white: #ffffff; --black: #000000;
  --chat-scale: 1.0; --chat-font-size: 22px; --chat-bg-opacity: 0.75;
  --my-bubble-bg: #0044cc; --my-bubble-text: #ffffff;
  --target-bubble-bg: #ffffff; --target-bubble-text: #000000;
  --bubble-radius: 0px;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'VT323', 'Courier New', monospace; user-select: none; }
body { background: #1a1a1a; color: var(--white); height: 100vh; overflow: hidden; display: flex; justify-content: center; align-items: center; }
.chat-container { width: 95%; max-width: 450px; height: 85vh; background: var(--white); border: 4px solid var(--theme-blue); box-shadow: 8px 8px 0 rgba(0,0,0,0.5); display: flex; flex-direction: column; position: relative; z-index: 10; overflow: hidden; font-size: var(--chat-font-size); transform: scale(var(--chat-scale)); transform-origin: center center; transition: transform 0.1s ease-out, border-color 0.3s; }
#lockScreen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 1000; display: none; flex-direction: column; justify-content: center; align-items: center; color: #00ff00; font-size: 20px; }
#lockScreen.active { display: flex; }
#lockScreen h2 { margin-bottom: 20px; font-size: 30px; letter-spacing: 2px; animation: pulse 2s infinite; }
#lockScreen input { background: #111; border: 2px solid #00ff00; color: #00ff00; font-size: 30px; text-align: center; padding: 10px; width: 200px; letter-spacing: 10px; margin-bottom: 20px; outline: none; }
#lockScreen button { background: #111; border: 2px solid #00ff00; color: #00ff00; font-size: 20px; padding: 10px 30px; cursor: pointer; }
#lockScreen button:active { background: #00ff00; color: #000; }
#lockScreen .error { color: #ff0000; margin-bottom: 10px; font-size: 16px; }
#weatherCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
.screensaver-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000000; z-index: 999; display: none; justify-content: center; align-items: center; color: #00ff00; font-size: 24px; text-align: center; flex-direction: column; }
.screensaver-overlay.active { display: flex; }
.screensaver-star { position: absolute; width: 4px; height: 4px; background: #00ff00; border-radius: 50%; animation: star-move 3s linear infinite; }
@keyframes star-move { 0% { transform: translate(0,0) scale(1); opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; } }
.screensaver-text { z-index: 1000; margin-top: 20px; animation: pulse 2s infinite; white-space: pre-line; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
.crt-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 99; display: none; background: repeating-linear-gradient(0deg, rgba(0,0,0,0.15), rgba(0,0,0,0.15) 1px, transparent 1px, transparent 2px); box-shadow: inset 0 0 100px rgba(0,0,0,0.3); }
.crt-overlay.active { display: block; }
@keyframes glitch-anim { 0% { transform: translate(0); } 20% { transform: translate(-2px,2px); } 40% { transform: translate(-2px,-2px); } 60% { transform: translate(2px,2px); } 80% { transform: translate(2px,-2px); } 100% { transform: translate(0); } }
.glitch-active { animation: glitch-anim 0.15s 3; }
@keyframes typing-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
.typing-cursor { display: inline-block; width: 10px; height: 1em; background: currentColor; animation: typing-blink 0.8s step-end infinite; vertical-align: middle; margin-left: 2px; }
.title-bar { background: var(--theme-blue); color: var(--white); padding: 8px 12px; display: flex; flex-direction: column; gap: 6px; border-bottom: 3px solid var(--theme-blue); transition: background 0.3s; position: relative; }
.title-top { display: flex; justify-content: space-between; align-items: center; width: 100%; }
.title-bottom { display: flex; justify-content: space-between; align-items: center; width: 100%; }
.title-header { display: flex; align-items: center; gap: 5px; white-space: nowrap; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
#chatTitle { font-size: 20px; font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 140px; }
.unread-badge { display: none; min-width: 20px; height: 20px; background: #ff3333; border: 2px solid var(--black); color: #fff; font-size: 12px; line-height: 16px; text-align: center; padding: 0 5px; border-radius: 10px; margin-left: 4px; font-weight: bold; animation: pulse 1.5s infinite; flex-shrink: 0; }
.unread-badge.active { display: inline-block; }
.title-bar-buttons { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
.title-bar-buttons span { display: inline-block; min-width: 20px; height: 20px; background: var(--gray); border: 2px solid var(--black); margin-left: 2px; text-align: center; line-height: 16px; cursor: pointer; color: var(--black); font-weight: bold; padding: 0 4px; font-size: 14px; }
#clearChatTopBtn { background: var(--gray) !important; color: var(--black) !important; }
#topSearchBtn { background: var(--gray) !important; color: var(--black) !important; font-size: 14px !important; }
.title-bar-buttons .music-btn { position: relative; }
.title-bar-buttons .music-btn .music-off-mark { position: absolute; bottom: -3px; right: -3px; min-width: 0; width: auto; height: auto; padding: 0; margin: 0; background: transparent; border: none; font-size: 12px; line-height: 1; font-weight: bold; color: #cc0000; display: block; text-align: center; cursor: default; }
.title-bar-buttons .music-btn.playing .music-off-mark { display: none; }
.device-info { font-size: 13px; display: flex; gap: 8px; color: #aaddff; align-items: center; }
.battery-bar { width: 30px; height: 10px; border: 1px solid #aaddff; position: relative; top: 1px; }
.battery-level { height: 100%; background: #aaddff; width: 80%; }
.signal-group { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
.signal-bars { display: flex; align-items: flex-end; gap: 2px; }
.bar { width: 3px; background: #666; border-radius: 1px; transition: background 0.3s; }
.bar.active { background: #00ff00; box-shadow: 0 0 4px #00ff00; }
#signalText { font-size: 13px; color: var(--white); text-shadow: 1px 1px 0 var(--black); white-space: nowrap; }
.chat-box { flex: 1; background: #e6e6e6; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; border-bottom: 4px solid var(--theme-blue); scrollbar-width: thin; scrollbar-color: var(--theme-blue) var(--gray); position: relative; transition: background 0.3s; background-size: cover; background-position: center center; background-repeat: no-repeat; }
.chat-box.has-bg::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(230,230,230,var(--chat-bg-opacity)); z-index: 0; pointer-events: none; }
.chat-box::-webkit-scrollbar { width: 8px; }
.chat-box::-webkit-scrollbar-track { background: var(--gray); }
.chat-box::-webkit-scrollbar-thumb { background: var(--theme-blue); }
.load-more-bar { text-align: center; padding: 6px; font-size: 14px; color: var(--theme-blue); cursor: pointer; background: rgba(255,255,255,0.6); border: 1px dashed var(--theme-blue); margin-bottom: 5px; }
.load-more-bar:active { background: rgba(0,68,204,0.15); }
.tag-filter { padding: 5px 10px; background: var(--gray); display: flex; gap: 5px; overflow-x: auto; border-bottom: 2px solid var(--black); }
.tag-filter select { padding: 5px; font-size: 16px; border: 2px solid var(--black); background: var(--white); outline: none; flex: 1; }
.message-container { display: flex; width: 100%; align-items: flex-start; position: relative; z-index: 1; }
.message-container.sent { flex-direction: row-reverse; }
.message-container.received { flex-direction: row; }
.message-container.system { justify-content: center; align-items: center; margin: 4px 0; }
.message-content-wrapper { display: flex; flex-direction: column; max-width: 80%; }
.message-container.sent .message-content-wrapper { align-items: flex-end; }
.message-container.received .message-content-wrapper { align-items: flex-start; }
.message-container.no-avatar .message-content-wrapper { max-width: 85%; }
.message-nickname { font-size: 0.6em; margin-bottom: 3px; padding: 0 5px; color: #333; text-shadow: -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff, 0 0 4px #fff; transition: color 0.3s, text-shadow 0.3s; }
body.dark-bg .message-nickname { color: #fff; text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, 0 0 4px #000; }
.message-container.sent .message-nickname { text-align: right; }
.message-container.received .message-nickname { text-align: left; }
.avatar-box { width: 40px; height: 40px; border: 2px solid var(--black); background: var(--white); display: flex; justify-content: center; align-items: center; flex-shrink: 0; margin: 0 5px; box-shadow: 2px 2px 0 rgba(0,0,0,0.2); overflow: hidden; }
.avatar-box img { width: 100%; height: 100%; object-fit: cover; }
.avatar-box svg { width: 100%; height: 100%; }
.time-divider { align-self: center; font-size: 0.6em; color: #666; background: rgba(200,200,200,0.6); padding: 2px 10px; border-radius: 8px; margin: 5px 0; z-index: 1; }
.message .quote-block { font-size: 0.75em; padding: 5px 8px; margin-bottom: 8px; border-left: 3px solid currentColor; background: rgba(128,128,128,0.15); word-break: break-all; border-radius: 2px; opacity: 0.9; display: block; }
.message.sent .quote-block { border-left-color: var(--my-bubble-text); background: rgba(255,255,255,0.15); }
.message.received .quote-block { border-left-color: var(--target-bubble-text); background: rgba(0,0,0,0.06); }
.message .quote-name { display: block; font-weight: bold; margin-bottom: 4px; line-height: 1.2; }
.message .quote-thumb { width: 60px !important; height: 60px !important; max-width: 60px !important; max-height: 60px !important; border: 1px solid rgba(0,0,0,0.3); object-fit: contain; image-rendering: pixelated; display: block; margin-top: 2px; background: #f5f5f5; }
body.dark-bg .message .quote-thumb { border-color: rgba(255,255,255,0.3); }
.message { padding: 10px 15px; line-height: 1.3; position: relative; word-wrap: break-word; overflow-wrap: break-word; word-break: break-word; width: fit-content; max-width: 100%; border-radius: var(--bubble-radius); }
.message.received { background: var(--target-bubble-bg); color: var(--target-bubble-text); border: 3px solid var(--black); box-shadow: 4px 4px 0 var(--theme-blue); }
.message.sent { background: var(--my-bubble-bg); color: var(--my-bubble-text); border: 3px solid var(--black); box-shadow: -4px 4px 0 rgba(0,0,0,0.2); }
.message.sent.tail::after { content: ''; position: absolute; right: -8px; top: 8px; width: 0; height: 0; border-left: 8px solid var(--my-bubble-bg); border-top: 6px solid transparent; border-bottom: 6px solid transparent; filter: drop-shadow(2px 0 0 var(--black)); }
.message.received.tail::after { content: ''; position: absolute; left: -8px; top: 8px; width: 0; height: 0; border-right: 8px solid var(--target-bubble-bg); border-top: 6px solid transparent; border-bottom: 6px solid transparent; filter: drop-shadow(-2px 0 0 var(--black)); }
.message .status { font-size: 0.7em; display: block; text-align: right; margin-top: 5px; opacity: 0.8; }
.message .status.sending { color: inherit; opacity: 0.6; }
.message .status.interference { color: #cc0000; font-weight: bold; animation: pulse 1s infinite; }
.message .status.read { color: #66ccff; }
.message img { width: 150px; height: 150px; max-width: 100%; border: 2px solid var(--black); margin-top: 5px; display: block; image-rendering: pixelated; object-fit: contain; background: #f5f5f5; }
.message.recalled { font-style: italic; opacity: 0.6; }
.system-msg { font-size: 0.68em; color: #444; background: rgba(190,190,190,0.55); padding: 4px 14px; border-radius: 12px; text-align: center; max-width: 85%; border: 1px solid rgba(0,0,0,0.15); line-height: 1.5; word-break: break-word; }
body.dark-bg .system-msg { color: #ddd; background: rgba(80,80,80,0.55); border-color: rgba(255,255,255,0.2); }
.typing-indicator { align-self: flex-start; background: var(--target-bubble-bg); color: var(--target-bubble-text); padding: 10px 15px; border: 3px solid var(--black); font-size: 1em; display: none; margin-left: 50px; position: relative; z-index: 1; align-items: center; }
.reply-preview-bar { display: none; background: #ddd; border-top: 2px solid var(--black); padding: 8px 15px; font-size: 14px; color: #333; position: relative; z-index: 10; align-items: center; justify-content: space-between; }
.reply-preview-bar.active { display: flex; }
.reply-preview-content { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-right: 10px; }
.reply-preview-content span { font-weight: bold; color: var(--theme-blue); }
.reply-cancel-btn { background: transparent; border: none; color: #cc0000; font-size: 18px; font-weight: bold; cursor: pointer; padding: 0 5px; }

/* ====== 悬浮回到底部按钮（放在聊天区右下角，不进入输入区） ====== */
.scroll-bottom-btn { position: absolute; bottom: 16px; right: 16px; width: 40px; height: 40px; background: var(--theme-blue); border: 3px solid var(--black); border-radius: 50%; display: none; justify-content: center; align-items: center; cursor: pointer; box-shadow: 2px 2px 0 rgba(0,0,0,0.3); z-index: 20; font-size: 18px; color: #fff; }
.scroll-bottom-btn:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 rgba(0,0,0,0.3); }
.scroll-bottom-btn.show { display: flex; }

/* ====== 底部输入区（严格约束，防变形） ====== */
.input-area { background: var(--gray); padding: 8px 6px; display: flex; flex-direction: column; gap: 6px; align-items: stretch; width: 100%; }
.input-row-top { display: flex; justify-content: center; align-items: center; width: 100%; gap: 8px; padding: 0 4px; }
.input-row-bottom { display: flex; width: 100%; gap: 5px; align-items: center; flex-wrap: nowrap; }

/* 输入框包装器 */
.input-wrap { flex: 1; min-width: 0; position: relative; display: flex; align-items: center; }
.input-wrap textarea { width: 100%; padding: 8px 30px 8px 8px; font-size: 0.9em; border: 3px solid var(--black); background: var(--white); outline: none; resize: none; font-family: inherit; line-height: 1.3; height: 40px !important; min-height: 40px !important; max-height: 120px !important; overflow-y: hidden; box-sizing: border-box; flex: 1; align-self: center; }

/* 清空输入框按钮（小灰叉嵌在输入框内部，只有文字时才显示） */
.clear-input-btn { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); width: 22px !important; height: 22px !important; min-width: 22px !important; min-height: 22px !important; padding: 0 !important; background: #999 !important; color: #fff !important; border: 2px solid #000 !important; border-radius: 50% !important; display: none; justify-content: center; align-items: center; font-size: 12px !important; line-height: 1 !important; z-index: 10; box-shadow: none !important; }
.clear-input-btn.show { display: flex; }
.clear-input-btn:active { background: #666; }

.input-area button { background: var(--theme-blue); color: var(--white); border: 3px solid var(--black); padding: 10px 8px; font-size: 0.9em; cursor: pointer; box-shadow: 3px 3px 0 var(--black); white-space: nowrap; transition: background 0.3s; flex-shrink: 0; height: 40px; box-sizing: border-box; }
.input-area button:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 var(--black); }

/* 工具按钮和表情按钮在单双行高度一致 */
.input-area button.settings-btn, .input-area button.call-btn, .input-area button.call-tool-btn, .input-area button.doodle-btn { padding: 0 12px !important; font-size: 20px !important; background: var(--gray) !important; color: var(--black) !important; display: flex; align-items: center; justify-content: center; }
.input-area button.emoji-btn { padding: 0 10px !important; font-size: 18px !important; background: var(--gray) !important; color: var(--black) !important; display: flex; align-items: center; justify-content: center; }
.input-area button#sendBtn { background: var(--theme-blue); color: var(--white); padding: 0 12px !important; font-size: 0.9em; display: flex; align-items: center; justify-content: center; }

.modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 100; justify-content: center; align-items: center; }
.modal-content { background: var(--gray); width: 90%; max-width: 400px; border: 3px solid var(--black); box-shadow: 6px 6px 0 var(--black); }
.modal-header { background: var(--theme-blue); color: var(--white); padding: 8px 10px; display: flex; justify-content: space-between; font-size: 20px; transition: background 0.3s; border-bottom: 2px solid var(--black); }
.modal-body { padding: 15px; color: var(--black); font-size: 18px; max-height: 65vh; overflow-y: auto; }
.modal-body label { display: block; margin-bottom: 5px; }
.modal-body input[type="text"], .modal-body textarea, .modal-body select { width: 100%; padding: 8px; margin-bottom: 10px; border: 2px solid var(--black); font-size: 18px; }
.modal-body textarea { height: 100px; resize: vertical; }
.modal-body button { background: var(--theme-blue); color: var(--white); border: 2px solid var(--black); padding: 8px 15px; margin-right: 5px; cursor: pointer; transition: background 0.3s; }
.modal-body button.danger { background: #cc0000; }
.slider-group { margin-bottom: 15px; background: #ddd; padding: 10px; border: 2px solid #999; }
.slider-group input[type="range"] { width: 100%; margin-top: 5px; }
.slider-value { font-weight: bold; color: var(--theme-blue); }
.toggle-group { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; background: #ddd; padding: 8px; border: 2px solid #999; }
.toggle-group input[type="checkbox"], .toggle-group input[type="radio"] { width: 20px; height: 20px; }
.color-group { display: flex; align-items: center; gap: 10px; margin-bottom: 5px; background: #ddd; padding: 8px; border: 2px solid #999; }
.color-group label { flex: 1; margin: 0; }
.color-group input[type="color"] { width: 40px; height: 30px; padding: 0; border: 1px solid #000; cursor: pointer; }
.color-group input[type="checkbox"] { width: 20px; height: 20px; }
.upload-btn { background: #006600 !important; color: white !important; font-size: 14px !important; padding: 5px 10px !important; margin-bottom: 10px; }
.random-btn { background: #6600cc !important; color: white !important; font-size: 14px !important; padding: 8px 10px !important; margin-bottom: 10px; width: 100%; }
.search-btn { background: #6600cc !important; color: white !important; font-size: 14px !important; padding: 8px 10px !important; width: 100%; margin-bottom: 5px; }
.reset-btn { background: #990000 !important; color: white !important; font-size: 14px !important; padding: 10px !important; width: 100%; margin-top: 5px; }
#doodleCanvas { width: 100%; height: 250px; border: 2px solid var(--black); background: var(--white); touch-action: none; cursor: crosshair; image-rendering: pixelated; }
.palette, .bg-palette, .line-width-group { display: flex; gap: 8px; margin-top: 8px; justify-content: center; }
.color-swatch, .bg-swatch { width: 25px; height: 25px; border: 2px solid var(--black); cursor: pointer; }
.color-swatch.active, .bg-swatch.active { border: 3px solid #ff0000; }
.bg-swatch { border-radius: 50%; }
.line-width-btn { background: #ccc; border: 2px solid #000; padding: 5px 15px; cursor: pointer; font-size: 14px; color: #000; box-shadow: 3px 3px 0 #000; transition: transform 0.05s, box-shadow 0.05s, background 0.15s; }
.line-width-btn:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 #000; }
.line-width-btn.active { background: var(--theme-blue); color: #fff; font-weight: bold; transform: translate(2px,2px); box-shadow: 1px 1px 0 #000, inset 0 0 0 2px rgba(0,0,0,0.4); }
.search-result { background: #fff; border: 1px solid #ccc; padding: 8px; margin-bottom: 5px; font-size: 14px; color: #333; cursor: pointer; }
.search-result:active { background: #eee; }
.search-result span { font-weight: bold; color: var(--theme-blue); }
@keyframes highlight-flash { 0%, 100% { background-color: transparent; } 50% { background-color: #ffff00; box-shadow: 0 0 10px #ffff00; } }
.highlight-msg { animation: highlight-flash 0.5s 4; border-radius: 5px; }
#exportModal, #importModal { z-index: 200; }
#callOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 300; display: none; flex-direction: column; align-items: center; color: var(--theme-light-blue); text-align: center; padding: 15px; }
#callOverlay.active { display: flex; }
.call-top { display: flex; flex-direction: column; align-items: center; margin-top: 30px; flex-shrink: 0; position: relative; width: 100%; }
.call-minimize-btn { position: absolute; top: 0; right: 0; width: 34px; height: 34px; border: 2px solid var(--theme-light-blue); background: transparent; color: var(--theme-light-blue); font-size: 16px; cursor: pointer; display: none; justify-content: center; align-items: center; }
.call-minimize-btn.show { display: flex; }
.call-avatar { width: 100px; height: 100px; border: 4px solid var(--theme-light-blue); background: #111; display: flex; justify-content: center; align-items: center; overflow: hidden; margin-bottom: 15px; box-shadow: 0 0 30px var(--theme-light-blue); animation: call-pulse 1.5s infinite; }
.call-avatar img { width: 100%; height: 100%; object-fit: cover; }
@keyframes call-pulse { 0%, 100% { box-shadow: 0 0 20px var(--theme-light-blue); } 50% { box-shadow: 0 0 50px var(--theme-light-blue); } }
.call-name { font-size: 24px; margin-bottom: 6px; letter-spacing: 2px; }
.call-status { font-size: 16px; color: var(--theme-light-blue); animation: pulse 1.5s infinite; }
.call-content { flex: 1; width: 100%; max-width: 420px; display: flex; justify-content: center; align-items: center; padding: 20px; overflow: hidden; margin: 10px 0; }
.call-card { background: rgba(0, 0, 0, 0.4); border: 3px solid var(--theme-light-blue); color: var(--theme-light-blue); padding: 24px 30px; font-size: 22px; max-width: 100%; text-align: center; line-height: 1.5; opacity: 0; transition: opacity 0.5s; word-break: break-word; box-shadow: 0 0 20px rgba(0,255,0,0.2); }
.call-card.show { opacity: 1; }
.call-card img { max-width: 100px; max-height: 100px; image-rendering: pixelated; }
.call-actions { display: flex; gap: 40px; margin-bottom: 20px; margin-top: 10px; flex-shrink: 0; }
.call-action-btn { width: 64px; height: 64px; border-radius: 50%; border: 3px solid var(--theme-light-blue); font-size: 28px; display: flex; justify-content: center; align-items: center; cursor: pointer; background: #111; color: var(--theme-light-blue); }
.call-action-btn.accept { background: #006600; color: #fff; }
.call-action-btn.reject { background: #660000; color: #fff; border-color: #ff3333; animation: pulse 1.5s infinite; }
.call-action-btn:active { transform: scale(0.9); }
#callMini { position: fixed; z-index: 400; background: #000; border: 3px solid var(--theme-light-blue); color: var(--theme-light-blue); display: none; align-items: center; gap: 8px; padding: 6px 10px; box-shadow: 0 0 20px var(--theme-light-blue); cursor: move; user-select: none; touch-action: none; transform: none; }
#callMini.active { display: flex; }
.call-mini-avatar { width: 32px; height: 32px; border: 2px solid var(--theme-light-blue); overflow: hidden; flex-shrink: 0; display: flex; justify-content: center; align-items: center; background: #111; }
.call-mini-avatar img { width: 100%; height: 100%; object-fit: cover; }
.call-mini-avatar svg { width: 100%; height: 100%; }
.call-mini-body { display: flex; flex-direction: column; min-width: 90px; }
.call-mini-name { font-size: 14px; line-height: 1.1; white-space: nowrap; }
.call-mini-time { font-size: 12px; color: var(--theme-light-blue); }
.call-mini-btn { width: 26px; height: 26px; border: 2px solid var(--theme-light-blue) !important; background: transparent; color: var(--theme-light-blue) !important; font-size: 13px; cursor: pointer; display: flex; justify-content: center; align-items: center; flex-shrink: 0; padding: 0; }
.call-mini-hangup { border-color: #ff3333; color: #ff3333; }
.advanced-toggle-btn { width:100%; margin-top:10px !important; margin-bottom:10px; padding:10px; background:#6600cc; color:#fff; border:2px solid #000; font-size:16px; font-weight:bold; cursor:pointer; box-shadow:3px 3px 0 #000; }
.advanced-toggle-btn:active { transform:translate(2px,2px); box-shadow:1px 1px 0 #000; }
.advanced-section { display:none; border-top:2px dashed #000; padding-top:10px; margin-top:5px; }
.advanced-section.active { display:block; }
#emojiPanel { display: none; position: absolute; bottom: 60px; left: 10px; width: 260px; background: var(--gray); border: 3px solid var(--black); box-shadow: 6px 6px 0 var(--black); z-index: 50; padding: 10px; flex-wrap: wrap; gap: 5px; }
#emojiPanel.active { display: flex; }
#emojiPanel .emoji-item { width: 40px; height: 40px; display: flex; justify-content: center; align-items: center; font-size: 24px; cursor: pointer; border: 2px solid transparent; }
#emojiPanel .emoji-item:hover { border-color: var(--theme-blue); background: rgba(0,0,0,0.1); }
body.dark-mode { background: #121212; color: #e0e0e0; }
body.dark-mode .chat-container { border-color: #333; }
body.dark-mode .chat-box { background: #1e1e1e; }

body.dark-mode .time-divider { background: rgba(80,80,80,0.8); color: #ccc; }
body.dark-mode .input-area { background: #2c2c2c; border-top: 2px solid #444; }
body.dark-mode .input-area textarea { background: #1e1e1e; color: #e0e0e0; border-color: #555; }
body.dark-mode .input-area button { border-color: #555; }
body.dark-mode .settings-btn, body.dark-mode .call-btn, body.dark-mode .doodle-btn, body.dark-mode .emoji-btn { background: #444 !important; color: #e0e0e0 !important; border-color: #555 !important; }
body.dark-mode .title-bar { background: #1a1a1a; border-bottom-color: #333; }
body.dark-mode .modal-content { background: #2c2c2c; border-color: #555; }
body.dark-mode .modal-header { background: #1a1a1a !important; color: #e0e0e0 !important; border-bottom: 1px solid #333; }
body.dark-mode .modal-body { background: #2c2c2c; color: #e0e0e0; }
body.dark-mode .modal-body input[type="text"], body.dark-mode .modal-body textarea, body.dark-mode .modal-body select { background: #1e1e1e; color: #e0e0e0; border-color: #555; }
body.dark-mode .slider-group, body.dark-mode .toggle-group, body.dark-mode .color-group { background: #3a3a3a; border-color: #555; color: #e0e0e0; }

body.dark-mode .search-result { background: #3a3a3a; color: #e0e0e0; border-color: #555; }
body.dark-mode .load-more-bar { background: rgba(255,255,255,0.1); color: #66aaff; }
body.dark-mode .reply-preview-bar { background: #3a3a3a; color: #e0e0e0; }
body.dark-mode .reply-preview-content span { color: #66aaff; }

body.dark-mode .toggle-group[style*="background:#e6e6ff"],
body.dark-mode .toggle-group[style*="background: #e6e6ff"] { background: #4a4a4a !important; border-color: #777 !important; }
body.dark-mode .toggle-group[style*="background:#e6e6ff"] label,
body.dark-mode .toggle-group[style*="background: #e6e6ff"] label { color: #ffffff !important; }
body.dark-mode .modal-body p,
body.dark-mode .modal-body label,
body.dark-mode #bgKeepAliveStatus,
body.dark-mode #musicStatusText,
body.dark-mode #radioStatus { color: #cccccc !important; }
body.dark-mode .modal-body p[style*="color:#333"],
body.dark-mode .modal-body p[style*="color: #333"] { color: #cccccc !important; }
</style>

<body>
<div id="lockScreen">
  <h2>[ 终端已锁定 ]</h2>
  <div id="lockError" class="error"></div>
  <input type="password" id="lockPasswordInput" placeholder="****" maxlength="4" inputmode="numeric">
  <button id="lockSubmitBtn">验证密码</button>
  <button id="lockResetBtn" style="margin-top:20px; font-size:14px; border-color:#666; color:#666;">重置密码（清除所有数据）</button>
</div>
<div class="screensaver-overlay" id="screensaver">
  <div class="screensaver-text" id="screensaverText">信号搜索中...</div>
</div>
<div id="callOverlay">
  <div class="call-top">
    <div class="call-minimize-btn" id="callMinimizeBtn" title="最小化">▼</div>
    <div class="call-avatar" id="callAvatar"></div>
    <div class="call-name" id="callName">梦角</div>
    <div class="call-status" id="callStatus">正在呼叫...</div>
  </div>
  <div class="call-content">
    <div class="call-card" id="callCard"></div>
  </div>
  <div class="call-actions" id="callActions"></div>
</div>
<div id="callMini">
  <div class="call-mini-avatar" id="callMiniAvatar"></div>
  <div class="call-mini-body">
    <div class="call-mini-name" id="callMiniName">梦角</div>
    <div class="call-mini-time" id="callMiniTime">00:00</div>
  </div>
  <button class="call-mini-btn" id="callMiniExpand" title="展开">▲</button>
  <button class="call-mini-btn call-mini-hangup" id="callMiniHangup" title="挂断">📵</button>
</div>
<div class="chat-container" id="chatContainer">
  <canvas id="weatherCanvas"></canvas>
  <div class="crt-overlay" id="crtOverlay"></div>
  
  <!-- 顶部标题栏（两行布局） -->
  <div class="title-bar">
    <div class="title-top">
      <div class="title-header">
        <span id="chatTitle">传讯接收器</span>
        <span class="unread-badge" id="unreadBadge">0</span>
      </div>
      <div class="title-bar-buttons">
        <span class="music-btn" id="musicBtn" title="播放/暂停">🎵<span class="music-off-mark">×</span></span>
        <span id="screenshotBtn" title="保存传讯截图">📷</span>
        <span id="clearChatTopBtn" title="清空聊天记录">🗑️</span>
        <span id="topSearchBtn" title="全局搜索">🔎</span>
        <span id="themeBtn" title="日夜切换" style="font-size:16px;">🌗</span>
      </div>
    </div>
    <div class="title-bottom">
      <div class="device-info" id="deviceInfo">
        <span id="timeIndicator">00:00</span>
        <div class="battery-bar"><div class="battery-level" id="batteryLevel" style="width:85%;"></div></div>
        <span id="batteryText">85%</span>
      </div>
      <div class="signal-group" id="signalGroup">
        <span id="signalText">正在连接</span>
        <div class="signal-bars" id="signalBars">
          <div class="bar" style="height:6px;"></div>
          <div class="bar" style="height:10px;"></div>
          <div class="bar" style="height:14px;"></div>
          <div class="bar" style="height:18px;"></div>
        </div>
      </div>
    </div>
  </div>
  
  <div class="tag-filter" id="tagFilterBar" style="display:none;">
    <select id="tagSelect"><option value="all">所有频道</option></select>
  </div>
  <div class="chat-box" id="chatBox">
    <!-- 悬浮回到底部按钮（放在聊天区右下角） -->
    <div class="scroll-bottom-btn" id="scrollBottomBtn" title="回到底部">⬇️</div>
  </div>
  <div class="typing-indicator" id="typingIndicator">对方正在输入<span class="typing-cursor"></span></div>
  <div class="reply-preview-bar" id="replyPreviewBar">
    <div class="reply-preview-content" id="replyPreviewContent"></div>
    <button class="reply-cancel-btn" id="replyCancelBtn">×</button>
  </div>
  <div id="emojiPanel"></div>

  <!-- 底部输入区（自适应单双行） -->
  <div class="input-area" id="inputArea">
    <!-- 第一行：工具图标（单行模式时隐藏并移位） -->
    <div class="input-row-top" id="toolRow">
      <button class="settings-btn" id="openSettingsBtn">⚙️</button>
      <button class="call-btn" id="callBtn" title="主动呼唤TA">📡</button>
      <button class="call-tool-btn" id="callToolBtn" title="拨打电话" style="display:none;">📞</button>
      <button class="doodle-btn" id="doodleBtn" title="像素涂鸦">🎨</button>
    </div>
    
    <!-- 第二行：输入框与发送 -->
    <div class="input-row-bottom" id="inputRowBottom">
      <button class="emoji-btn" id="emojiBtn" title="像素表情"><svg viewBox="0 0 16 16" width="24" height="24" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg"><rect x="3" y="4" width="10" height="8" fill="none" stroke="currentColor" stroke-width="2"/><rect x="5" y="6" width="2" height="2" fill="currentColor"/><rect x="9" y="6" width="2" height="2" fill="currentColor"/><rect x="5" y="9" width="6" height="2" fill="currentColor"/></svg></button>
      
      <div class="input-wrap">
        <textarea id="userInput" placeholder="输入你想说的话..." autocomplete="off" enterkeyhint="send" rows="1"></textarea>
        <button class="clear-input-btn" id="clearInputBtn" title="清空输入">✕</button>
      </div>
      
      <button id="sendBtn">发送</button>
    </div>
  </div>
</div>
<div class="modal" id="msgActionModal">
  <div class="modal-content" style="max-width:250px;">
    <div class="modal-header"><span>操作</span><span style="cursor:pointer;" onclick="document.getElementById('msgActionModal').style.display='none'">×</span></div>
    <div class="modal-body" style="display:flex; flex-direction:column; gap:10px;">
      <button id="msgQuoteBtn" style="width:100%;">💬 引用</button>
      <button id="msgCopyBtn" style="width:100%;">📋 复制</button>
      <button id="msgEditBtn" style="width:100%; display:none;">✏️ 编辑</button>
      <button id="msgRecallBtn" class="danger" style="width:100%; display:none;">↩️ 撤回</button>
      <button id="msgDeleteBtn" class="danger" style="width:100%;">🗑️ 删除</button>
      <button onclick="document.getElementById('msgActionModal').style.display='none'" style="width:100%; background:#666 !important;">取消</button>
    </div>
  </div>
</div>
<div class="modal" id="editMsgModal">
  <div class="modal-content" style="max-width:340px;">
    <div class="modal-header"><span>编辑消息</span><span style="cursor:pointer;" onclick="document.getElementById('editMsgModal').style.display='none'">×</span></div>
    <div class="modal-body">
      <textarea id="editMsgInput" placeholder="修改内容..." style="height:80px;"></textarea>
      <div style="display:flex; gap:8px; margin-top:10px;">
        <button id="editMsgConfirmBtn" style="flex:1; background:#006600 !important;">保存</button>
        <button onclick="document.getElementById('editMsgModal').style.display='none'" style="flex:1; background:#666 !important;">取消</button>
      </div>
    </div>
  </div>
</div>
<div class="modal" id="doodleModal">
  <div class="modal-content" style="max-width:350px;">
    <div class="modal-header"><span>像素涂鸦板</span><span style="cursor:pointer;" onclick="document.getElementById('doodleModal').style.display='none'">×</span></div>
    <div class="modal-body">
      <canvas id="doodleCanvas" width="320" height="320"></canvas>
      <div class="bg-palette" id="bgPaletteContainer"></div>
      <div class="palette" id="paletteContainer"></div>
      <div class="line-width-group">
        <button class="line-width-btn" data-width="4">细</button>
        <button class="line-width-btn active" data-width="16">中</button>
        <button class="line-width-btn" data-width="32">粗</button>
      </div>
      <div style="display:flex; gap:8px; margin-top:10px;">
        <button id="doodleUndoBtn" style="flex:1; background:#666 !important;">↩️ 撤销</button>
        <button id="doodleRedoBtn" style="flex:1; background:#666 !important;">↪️ 重做</button>
      </div>
      <button id="doodleSendBtn" style="width:100%; margin-top:10px; background:#006600 !important;">发送涂鸦</button>
      <button id="doodleClearBtn" class="danger" style="width:100%; margin-top:5px;">清空画板</button>
    </div>
  </div>
</div>
<div class="modal" id="searchModal">
  <div class="modal-content" style="max-width:350px;">
    <div class="modal-header"><span>全局搜索</span><span style="cursor:pointer;" onclick="document.getElementById('searchModal').style.display='none'">×</span></div>
    <div class="modal-body">
      <input type="text" id="globalSearchInput" placeholder="输入关键词搜索聊天记录或字卡..." style="width:100%; padding:8px; margin-bottom:10px; border:2px solid #000; font-size:16px;">
      <div id="searchResults" style="max-height:300px; overflow-y:auto;"><p style="font-size:14px; color:#777;">输入关键词开始搜索...</p></div>
    </div>
  </div>
</div>
<div class="modal" id="alertModal">
  <div class="modal-content" style="max-width:300px;">
    <div class="modal-header"><span>⚠️ 系统提醒</span></div>
    <div class="modal-body">
      <p id="alertMessage" style="font-size:16px; line-height:1.4; white-space:pre-line;"></p>
      <div style="margin-top:15px; display:flex; justify-content:flex-end;">
        <button id="alertOkBtn" style="background:#0044cc !important;">确定</button>
      </div>
    </div>
  </div>
</div>
<div class="modal" id="exportModal">
  <div class="modal-content" style="max-width:340px;">
    <div class="modal-header"><span>导出数据</span><span style="cursor:pointer;" onclick="document.getElementById('exportModal').style.display='none'">×</span></div>
    <div class="modal-body">
      <p style="font-size:14px; color:#333; margin-bottom:10px;">请勾选要导出的内容：</p>
      <div class="toggle-group"><input type="checkbox" id="exportMessages" checked><label for="exportMessages">聊天记录（当前角色）</label></div>
      <div class="toggle-group"><input type="checkbox" id="exportCards" checked><label for="exportCards">字卡库（当前角色）</label></div>
      <div class="toggle-group"><input type="checkbox" id="exportSettings" checked><label for="exportSettings">系统设置（含头像/主题/背景）</label></div>
      <div class="toggle-group"><input type="checkbox" id="exportProfiles" checked><label for="exportProfiles">角色档案（含所有角色及各自记录）</label></div>
      <div style="display:flex; gap:8px; margin-top:15px;">
        <button id="exportConfirmBtn" style="flex:1; background:#006600 !important;">确认导出</button>
        <button onclick="document.getElementById('exportModal').style.display='none'" style="flex:1; background:#666 !important;">取消</button>
      </div>
    </div>
  </div>
</div>
<div class="modal" id="importModal">
  <div class="modal-content" style="max-width:340px;">
    <div class="modal-header"><span>导入数据</span><span style="cursor:pointer;" onclick="document.getElementById('importModal').style.display='none'">×</span></div>
    <div class="modal-body">
      <p style="font-size:14px; color:#333; margin-bottom:10px;">请勾选要导入的内容：</p>
      <div class="toggle-group"><input type="checkbox" id="importMessages" checked><label for="importMessages">聊天记录（合并到当前角色）</label></div>
      <div class="toggle-group"><input type="checkbox" id="importCards" checked><label for="importCards">字卡库（当前角色）</label></div>
      <div class="toggle-group"><input type="checkbox" id="importSettings"><label for="importSettings">系统设置</label></div>
      <div class="toggle-group"><input type="checkbox" id="importProfiles"><label for="importProfiles">角色档案（多梦角）</label></div>
      <p style="font-size:14px; color:#333; margin:12px 0 8px;">导入模式：</p>
      <div class="toggle-group"><input type="radio" name="importMode" id="importModeOverwrite" value="overwrite"><label for="importModeOverwrite">覆盖（清空原有数据后导入）</label></div>
      <div class="toggle-group"><input type="radio" name="importMode" id="importModeAppend" value="append" checked><label for="importModeAppend">追加（仅添加新内容，自动去重）</label></div>
      <div style="display:flex; gap:8px; margin-top:15px;">
        <button id="importConfirmBtn" style="flex:1; background:#006600 !important;">选择文件并导入</button>
        <button onclick="document.getElementById('importModal').style.display='none'" style="flex:1; background:#666 !important;">取消</button>
      </div>
    </div>
  </div>
</div>
<div class="modal" id="settingsModal">
  <div class="modal-content">
    <div class="modal-header"><span>系统设置</span><span style="cursor:pointer;" onclick="document.getElementById('settingsModal').style.display='none'">×</span></div>
    <div class="modal-body">
      <div class="slider-group">

        <input type="range" id="scaleRange" min="70" max="120" step="5" value="100">

        <input type="range" id="fontSizeRange" min="16" max="30" step="1" value="22">
      </div>
      <label>窗口标题（自定义）：</label>

      <label>你的昵称：</label> <input type="text" id="myNameInput" placeholder="用户">

      <label>颜色主题：</label>
      <select id="themeSelect">
        <option value="blue">经典蓝 (Y2K)</option>
        <option value="purple">复古紫</option>
        <option value="green">森林绿</option>
        <option value="gray">暗夜灰</option>
        <option value="pink">樱花粉</option>
        <option value="orange">暖阳橙</option>
        <option value="cyan">冰晶青</option>
        <option value="warm">暖棕咖啡</option>
        <option value="night">午夜蓝</option>
        <option value="neon">霓虹紫</option>
      </select>
      <label>气泡样式：</label>
      <select id="bubbleStyleSelect">
        <option value="square">方框（默认）</option>
        <option value="round">圆角</option>
        <option value="tail">带尾巴</option>
      </select>
      <label>聊天背景图（直接上传）：</label>
      <input type="file" id="chatBgFile" accept="image/*" style="display:none;">
      <button class="upload-btn" id="uploadChatBgBtn" style="background:#0044cc !important;">📁 上传聊天背景图</button>
      <div class="slider-group" id="bgOpacityGroup" style="display:none;">
        <label>背景遮罩透明度：<span class="slider-value" id="bgOpacityVal">75</span>%</label>
        <input type="range" id="bgOpacityRange" min="30" max="95" step="5" value="75">
      </div>
      <button id="removeChatBgBtn" class="danger" style="width:100%; margin-bottom:10px; font-size:14px; padding:5px;">❌ 移除聊天背景</button>
      <label>你的头像（直接点此上传）：</label>
      <input type="file" id="myAvatarFile" accept="image/*" style="display:none;">

<script>
// ====== 基础工具 ======
function safeSetItem(k, v) { try { localStorage.setItem(k, v); } catch(e) {} }
function safeGetItem(k, d) { try { var i = localStorage.getItem(k); return i ? JSON.parse(i) : d; } catch(e) { return d; } }
var idbDB = null;
function initIndexedDB() { return new Promise(function(resolve) { if (!window.indexedDB) { resolve(); return; } var request = indexedDB.open('ChuanXunDB', 2); request.onupgradeneeded = function(e) { var db = e.target.result; if (!db.objectStoreNames.contains('kv')) db.createObjectStore('kv'); }; request.onsuccess = function(e) { idbDB = e.target.result; resolve(); }; request.onerror = function() { resolve(); }; }); }
function idbSet(key, value) { return new Promise(function(resolve) { if (!idbDB) return resolve(); try { var req = idbDB.transaction('kv', 'readwrite').objectStore('kv').put(value, key); req.onsuccess = resolve; req.onerror = resolve; } catch(e) { resolve(); } }); }
function idbGet(key) { return new Promise(function(resolve) { if (!idbDB) return resolve(null); try { var req = idbDB.transaction('kv', 'readonly').objectStore('kv').get(key); req.onsuccess = function() { resolve(req.result || null); }; req.onerror = function() { resolve(null); }; } catch(e) { resolve(null); } }); }
function idbDelete(key) { return new Promise(function(resolve) { if (!idbDB) return resolve(); try { var req = idbDB.transaction('kv', 'readwrite').objectStore('kv').delete(key); req.onsuccess = resolve; req.onerror = resolve; } catch(e) { resolve(); } }); }

var audioCtx = null, ambientSource = null, ambientGain = null, typingSoundInterval = null, screensaverTimer = null, autoMessageTimer = null, incomingCallTimer = null, incomingCallTimeout = null, radioNoiseSource = null, radioNoiseGain = null, radioMelodyTimer = null, isRadioPlaying = false, musicInterval = null, isMusicPlaying = false, musicNoteIndex = 0;
const melody = [{freq:392,dur:0.2},{freq:523,dur:0.2},{freq:659,dur:0.2},{freq:783,dur:0.4},{freq:659,dur:0.2},{freq:523,dur:0.2},{freq:392,dur:0.4},{freq:440,dur:0.2},{freq:523,dur:0.2},{freq:659,dur:0.2},{freq:880,dur:0.4},{freq:659,dur:0.2},{freq:523,dur:0.2},{freq:440,dur:0.4}];
var customAudioSrc = '', customAudioFile = null, nativeAudioPlayer = new Audio(), currentQuote = null, weatherCanvas = document.getElementById('weatherCanvas'), weatherCtx = weatherCanvas.getContext('2d'), weatherParticles = [], weatherAnimationId = null, isLocked = false, correctPassword = '';
var doodleCanvas = document.getElementById('doodleCanvas'), doodleCtx = doodleCanvas.getContext('2d'), isDrawing = false, currentColor = '#000000', currentBgColor = '#ffffff', currentLineWidth = 16, renderLimit = 40, unreadCount = 0, typewriterActive = {};
var lastExportTime = parseInt(localStorage.getItem('mj_last_export') || '0');
var callState = { status: 'idle', direction: null, minimized: false, callStartTime: 0, durationTimer: null, speakTimer: null, ringTimer: null, answerTimeout: null, signalBreakTimer: null, peerHangupTimer: null };
var doodleHistory = [], doodleRedoStack = [], doodleMaxHistory = 20;

function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
function getVolume(v) { return state.settings.retroAudio ? v * 0.2 : v; }
function playTone(freq, type, dur, base) { try { initAudio(); var osc = audioCtx.createOscillator(), gain = audioCtx.createGain(); osc.type = type; osc.frequency.value = freq; osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); var vol = getVolume(base || 0.1); gain.gain.setValueAtTime(vol, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur); osc.stop(audioCtx.currentTime + dur); } catch(e) {} }
function playSendSound() { playTone(600, 'square', 0.1, 0.15); }
function playRecvSound() { playTone(400, 'sawtooth', 0.15, 0.15); }
function showAlert(msg, cb) { document.getElementById('alertMessage').innerText = msg; document.getElementById('alertModal').style.display = 'flex'; document.getElementById('alertOkBtn').onclick = function() { document.getElementById('alertModal').style.display = 'none'; if (cb) cb(); }; }

// ====== 天气特效 ======
function initWeather() { weatherCanvas.width = weatherCanvas.parentElement.clientWidth; weatherCanvas.height = weatherCanvas.parentElement.clientHeight; var lastWeatherWidth = weatherCanvas.width;
window.addEventListener('resize', function() { var newW = weatherCanvas.parentElement.clientWidth; if (newW !== lastWeatherWidth) { lastWeatherWidth = newW; weatherCanvas.width = newW; weatherCanvas.height = weatherCanvas.parentElement.clientHeight; } }); startWeather(); }
function startWeather() { if (weatherAnimationId) cancelAnimationFrame(weatherAnimationId); weatherParticles = []; var type = state.settings.weatherEffect || 'none'; var count = type === 'matrix' ? 50 : (type === 'firefly' ? 40 : 100); for (var i = 0; i < count; i++) weatherParticles.push({ x: Math.random() * weatherCanvas.width, y: Math.random() * weatherCanvas.height, speed: Math.random() * 2 + 1, size: Math.random() * 3 + 1, char: String.fromCharCode(0x30A0 + Math.random() * 96), wobble: Math.random() * Math.PI * 2, alpha: Math.random() * 0.5 + 0.5 }); animateWeather(); }
function animateWeather() { weatherCtx.clearRect(0, 0, weatherCanvas.width, weatherCanvas.height); var type = state.settings.weatherEffect || 'none'; if (type === 'none') { weatherAnimationId = requestAnimationFrame(animateWeather); return; } weatherParticles.forEach(function(p) { if (type === 'rain') { weatherCtx.fillStyle = '#ffffff'; weatherCtx.fillRect(p.x, p.y, 2, 10); p.y += p.speed * 2; } else if (type === 'snow') { weatherCtx.fillStyle = '#ffffff'; weatherCtx.beginPath(); weatherCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2); weatherCtx.fill(); p.wobble += 0.02; p.x += Math.sin(p.wobble) * 0.5; p.y += p.speed; } else if (type === 'matrix') { weatherCtx.fillStyle = '#00ff00'; weatherCtx.font = '16px "VT323"'; weatherCtx.fillText(p.char, p.x, p.y); p.y += p.speed * 2; } else if (type === 'sakura') { weatherCtx.fillStyle = 'rgba(255,183,197,' + p.alpha + ')'; weatherCtx.beginPath(); weatherCtx.arc(p.x, p.y, p.size + 1, 0, Math.PI * 2); weatherCtx.fill(); p.wobble += 0.03; p.x += Math.sin(p.wobble) * 1.2; p.y += p.speed * 0.8; } else if (type === 'firefly') { weatherCtx.fillStyle = 'rgba(255,255,100,' + (0.5 + Math.sin(p.wobble) * 0.5) + ')'; weatherCtx.shadowBlur = 8; weatherCtx.shadowColor = '#ffff66'; weatherCtx.beginPath(); weatherCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2); weatherCtx.fill(); weatherCtx.shadowBlur = 0; p.wobble += 0.05; p.x += Math.sin(p.wobble) * 0.8; p.y += Math.cos(p.wobble * 0.7) * 0.5; if (p.y < 0) p.y = weatherCanvas.height; if (p.y > weatherCanvas.height) p.y = 0; } else if (type === 'stars') { weatherCtx.fillStyle = 'rgba(255,255,255,' + (0.3 + Math.sin(p.wobble) * 0.7) + ')'; weatherCtx.fillRect(p.x, p.y, 2, 2); p.wobble += 0.08; } else if (type === 'leaves') { weatherCtx.fillStyle = 'rgba(200,120,40,' + p.alpha + ')'; weatherCtx.fillRect(p.x, p.y, p.size + 2, p.size); p.wobble += 0.03; p.x += Math.sin(p.wobble) * 1.5; p.y += p.speed * 0.9; } if (p.y > weatherCanvas.height) { p.y = -10; p.x = Math.random() * weatherCanvas.width; } if (p.x < -20) p.x = weatherCanvas.width; if (p.x > weatherCanvas.width + 20) p.x = 0; }); weatherAnimationId = requestAnimationFrame(animateWeather); }

// ====== 电台与音频 ======
function startRadioNoise() { try { initAudio(); if (radioNoiseSource) return; var bs = 2 * audioCtx.sampleRate; var buf = audioCtx.createBuffer(1, bs, audioCtx.sampleRate); var d = buf.getChannelData(0); for (var i = 0; i < bs; i++) d[i] = Math.random() * 2 - 1; radioNoiseSource = audioCtx.createBufferSource(); radioNoiseSource.buffer = buf; radioNoiseSource.loop = true; var f = audioCtx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 800; radioNoiseGain = audioCtx.createGain(); radioNoiseGain.gain.value = 0.05; radioNoiseSource.connect(f); f.connect(radioNoiseGain); radioNoiseGain.connect(audioCtx.destination); radioNoiseSource.start(); } catch(e) {} }
function stopRadioNoise() { if (radioNoiseSource) { radioNoiseSource.stop(); radioNoiseSource = null; } if (radioNoiseGain) { radioNoiseGain.disconnect(); radioNoiseGain = null; } }
function playRadioMelody() { if (isRadioPlaying) return; isRadioPlaying = true; var ni = 0; function next() { if (!isRadioPlaying) return; var n = melody[ni % melody.length]; playTone(n.freq, 'sine', n.dur * 0.8, 0.05); ni++; radioMelodyTimer = setTimeout(next, n.dur * 1000); } next(); }
function stopRadioMelody() { isRadioPlaying = false; if (radioMelodyTimer) clearTimeout(radioMelodyTimer); }
document.getElementById('radioFrequency').addEventListener('input', function(e) { var freq = parseFloat(e.target.value); state.settings.radioFrequency = freq; saveData(); document.getElementById('radioStatus').innerText = '当前频率：' + (freq / 10).toFixed(1) + ' MHz'; if (freq > 0) { startRadioNoise(); if (freq >= 50 && freq <= 60) playRadioMelody(); else stopRadioMelody(); } else { stopRadioNoise(); stopRadioMelody(); } });

// ====== 搜索 ======
document.getElementById('topSearchBtn').onclick = openSearch;

// ====== 截图 ======
document.getElementById('screenshotBtn').onclick = function() { if (longPressTimer) clearTimeout(longPressTimer); var libLoaded = typeof html2canvas !== 'undefined'; if (libLoaded) { doScreenshot(); } else { idbGet('html2canvas_lib').then(function(cached) { if (cached) { if (typeof html2canvas !== 'undefined') { doScreenshot(); } else { loadHtml2Canvas(doScreenshot); } } else { showAlert('首次使用截图功能需要联网加载组件，加载成功后即可永久离线使用。是否现在联网加载？', function() { var script = document.createElement('script'); script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'; script.onload = function() { idbSet('html2canvas_lib', 'true'); doScreenshot(); }; script.onerror = function() { showAlert('联网失败，请检查网络，或直接使用手机系统截屏。'); }; document.head.appendChild(script); }); } }); } };

document.getElementById('exportTxtCardsBtn').onclick = function() {

    }

// ====== 清除所有数据 ======
function clearAllData() {
  localStorage.clear();
  if (idbDB) {
    try {
      var tx = idbDB.transaction('kv', 'readwrite');
      var store = tx.objectStore('kv');
      store.clear();
      tx.oncomplete = function() { location.reload(); };
      tx.onerror = function() { location.reload(); };
    } catch(e) { location.reload(); }
  } else {
    location.reload();
  }
}
async function bootApp() {
  await initIndexedDB();
  var needSave = false;
  state.messages.forEach(function(m, i) { if (!m.id) { m.id = 'm_' + i + '_' + Date.now() + '_' + Math.random().toString(36).substr(2,4); needSave = true; } });
  if (needSave) saveData();
  var bg = await idbGet('bg_image'); if (bg) { state.settings.chatBg = bg; }
  var myAv = await idbGet('my_avatar'); if (myAv) { state.settings.myAvatar = myAv; }
  var targetAv = await idbGet('target_avatar'); if (targetAv) { getCurrentProfile().avatar = targetAv; }
  var audioBlob = await idbGet('audio_custom'); if (audioBlob) { customAudioFile = audioBlob; customAudioSrc = URL.createObjectURL(audioBlob); }
  initWeather(); checkPassword(); refreshProfileSelect(); applyVisualSettings(); renderChat();
  setTimeout(function() { var needBackup = false; if (state.messages.length > 500 && Date.now() - lastExportTime > 7 * 24 * 60 * 60 * 1000) needBackup = true; else if (Date.now() - lastExportTime > 30 * 24 * 60 * 60 * 1000) needBackup = true; if (needBackup) { showAlert('📦 温馨提醒：您已经有一段时间没有备份聊天记录了。\n\n数据存放在浏览器本地，如果清理缓存可能会丢失。建议点击设置里的“导出JSON”备份一下哦～', function() { localStorage.setItem('mj_last_export', Date.now()); lastExportTime = Date.now(); }); } }, 3000);
}
bootApp();
